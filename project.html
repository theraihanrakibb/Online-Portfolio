let curLang='en';
function setLang(lang){
  curLang=lang;document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(I18N[lang][k]!==undefined)el.innerHTML=I18N[lang][k];});
  document.getElementById('langBtn').textContent=lang==='en'?'中':'EN';
  try{localStorage.setItem('lang',lang);}catch(e){}
  render();
}

function drawArch(arch){
  const W=172,H=62,gapC=86,gapR=56;
  const cols=Math.max.apply(null,arch.nodes.map(n=>n.c))+1;
  const rows=Math.max.apply(null,arch.nodes.map(n=>n.r))+1;
  const w=cols*W+(cols-1)*gapC, h=rows*H+(rows-1)*gapR;
  const pos={};arch.nodes.forEach(n=>{pos[n.id]={x:n.c*(W+gapC)+W/2,y:n.r*(H+gapR)+H/2};});
  let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Architecture diagram">`;
  s+=`<defs><linearGradient id="ng" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#b566ff"/></linearGradient>`+
     `<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#9fb0c9"/></marker></defs>`;
  arch.edges.forEach(e=>{
    const a=pos[e.from],b=pos[e.to];if(!a||!b)return;
    const dir=b.x>=a.x?1:-1;
    const sx=a.x+dir*W/2, sy=a.y, ex=b.x-dir*W/2, ey=b.y;
    const c1x=sx+dir*Math.max(40,Math.abs(ex-sx)*0.5), c2x=ex-dir*Math.max(40,Math.abs(ex-sx)*0.5);
    s+=`<path d="M${sx},${sy} C ${c1x},${sy} ${c2x},${ey} ${ex},${ey}" fill="none" stroke="#3a4a63" stroke-width="1.6" marker-end="url(#ar)"/>`;
    if(e.label){const mx=(sx+ex)/2,my=(sy+ey)/2;s+=`<rect x="${mx-26}" y="${my-11}" width="52" height="20" rx="6" fill="#0f1320" stroke="#2a3650"/><text x="${mx}" y="${my+4}" text-anchor="middle" font-size="10.5" fill="#9fb0c9" font-family="JetBrains Mono,monospace">${e.label}</text>`;}
  });
  arch.nodes.forEach(n=>{
    const x=n.c*(W+gapC)+W/2,y=n.r*(H+gapR)+H/2;
    s+=`<rect x="${x-W/2}" y="${y-H/2}" width="${W}" height="${H}" rx="12" fill="#0d1322" stroke="url(#ng)" stroke-width="1.5"/>`;
    const lines=(n.label||'').split('\n');
    lines.forEach((ln,i)=>{const ty=y-(lines.length-1)*9+i*18+5;s+=`<text x="${x}" y="${ty}" text-anchor="middle" font-size="13" fill="#e8ecf4" font-family="Inter,sans-serif" font-weight="600">${ln}</text>`;});
  });
  s+=`</svg>`;return s;
}

function render(){
  const L=curLang, T=I18N[L];
  const id=new URLSearchParams(location.search).get('id');
  const d=STUDIES[id];
  const root=document.getElementById('content');
  if(!d){root.innerHTML=`<div class="nf"><h1 class="title" style="font-size:2rem">${T.notfound}</h1><p style="margin-top:12px">${T.notfound2} <a href="index.html">${T.back}</a></p></div>`;return;}
  const repo=d.github.replace('https://github.com/','');
  const zh=L==='zh';
  const problem=zh?d.problemZ:d.problem, design=zh?d.designZ:d.design, why=zh?d.whyZ:d.why;
  const area=zh?d.areaZ:d.area;
  const benchHtml=d.bench.map(b=>`<div class="bench-card"><div class="bench-v">${b.v}</div><div class="bench-m">${b.m}</div><div class="bench-c">${b.c}</div></div>`).join('');
  const compHtml=d.arch.nodes.map(n=>`<span>${(n.label||'').split('\n')[0]}</span>`).join('');
  root.innerHTML=`
    <span class="tag ${d.tag}">${area}</span>
    <div class="pill">&#9679; ${d.live}</div>
    <h1 class="title"><span class="g">${d.n}</span></h1>
    <p class="lede">${zh?d.designZ:d.design}</p>
    <div class="repo-badges">
      <a href="${d.github}" target="_blank" rel="noopener"><img loading="lazy" alt="stars" src="https://img.shields.io/github/stars/${repo}?style=flat-square&logo=github&label=stars&color=00e5ff"></a>
      <a href="${d.github}/forks" target="_blank" rel="noopener"><img loading="lazy" alt="forks" src="https://img.shields.io/github/forks/${repo}?style=flat-square&logo=github&label=forks&color=b566ff"></a>
    </div>
    <div class="links" style="margin-top:16px">
      <a href="${d.github}" target="_blank" rel="noopener" class="btn btn-primary">${T.live} &#8594;</a>
      <a href="index.html#projects" class="btn btn-ghost">${T.back}</a>
    </div>

    <section class="block">
      <h2 class="sec-title">${T.sec_overview}</h2>
      <div class="cs-row"><div class="cs-k">${T.k_prob}</div><div class="cs-v">${problem}</div></div>
      <div class="cs-row"><div class="cs-k">${T.k_design}</div><div class="cs-v">${design}</div></div>
      <div class="cs-row"><div class="cs-k">${T.k_why}</div><div class="cs-v">${why}</div></div>
    </section>

    <section class="block">
      <h2 class="sec-title">${T.sec_arch}</h2>
      <div class="diagram">${drawArch(d.arch)}</div>
    </section>

    <section class="block">
      <h2 class="sec-title">${T.sec_bench}</h2>
      <div class="bench-grid">${benchHtml}</div>
    </section>

    ${compHtml?`<section class="block"><h2 class="sec-title">${T.sec_stack}</h2><div class="tags">${compHtml}</div></section>`:''}
  `;
}

/* Theme */
const themeBtn=document.getElementById('themeBtn');
function applyTheme(light){document.body.classList.toggle('light',light);themeBtn.innerHTML=light?'&#9788;':'&#9202;';try{localStorage.setItem('theme',light?'light':'dark');}catch(e){}}
themeBtn.addEventListener('click',()=>applyTheme(!document.body.classList.contains('light')));
try{if(localStorage.getItem('theme')==='light')applyTheme(true);}catch(e){}
document.getElementById('langBtn').addEventListener('click',()=>setLang(curLang==='en'?'zh':'en'));
document.getElementById('year').textContent=new Date().getFullYear();
try{const saved=localStorage.getItem('lang');if(saved==='zh'||saved==='en')setLang(saved);else setLang('en');}catch(e){setLang('en');}
</script>
